---
- name: Run server docker image from registry
  docker_container:
    name: "{{ server_container_name }}-{{ name }}"
    image: "{{ server_registry_image_name }}"
    recreate: true
    restart: false
    restart_policy: unless-stopped
    published_ports:
      - "{{ server_port }}:{{ server_port }}"
      - "8111:8111"
    volumes:
      - /home/{{ username }}/backend/public:/home/jayjah/app/public:rw
    env_file: "/home/{{ username }}/backend/keys_config.env"
    user: "901:0"
    output_logs: yes
    interactive: yes
    tty: yes
    pull: yes
    log_driver: "json-file"
    log_options:
      max-size: '10m'
      labels: "backend"
      max-file: '3'